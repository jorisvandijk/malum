name: test

# Lint and the Linux tests, on pull requests that change code. The macOS-only targets are
# behind #if os(macOS) in Package.swift; run the "test-macos" workflow by hand when a change
# touches them.
on:
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".swift-format"
      - "**/.swiftlint.yml"
      - ".github/workflows/test.yml"
      - "docs/config.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SWIFTLINT_VERSION: "0.65.1"
  JSCPD_VERSION: "4.3.0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift-format
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Install SwiftLint
        run: |
          apt-get -qq update && apt-get -qq install -y unzip curl > /dev/null
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/swiftlint_linux_amd64.zip"
          unzip -q swiftlint.zip -d /usr/local/bin
          rm swiftlint.zip
          swiftlint version
      - name: SwiftLint
        env:
          # SwiftLint's Linux build loads SourceKit from the toolchain for the rules that need it.
          LINUX_SOURCEKIT_LIB_PATH: /usr/lib
        run: swiftlint lint --strict --quiet

  duplicates:
    # Fails on any copied block of 60 tokens or more in Sources. Its own job because the
    # Swift container has no Node.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its parent, the base branch, for the size line.
          fetch-depth: 2
      - name: jscpd
        run: npx --yes jscpd@$JSCPD_VERSION --min-tokens 60 --threshold 0 Sources
      - name: Sources size
        # Not a gate: the lines of Sources the pull request adds and removes, in the log and
        # the run summary.
        if: github.event_name == 'pull_request'
        run: |
          git diff --numstat HEAD^1 HEAD -- Sources \
            | awk '{ added += $1; removed += $2 } END { printf "Sources: +%d -%d lines\n", added, removed }' \
            | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-linux-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: swift-linux-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - name: Config docs match the schemas
        run: |
          swift run --skip-build MalumDocs
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            git diff -- docs
            echo "docs/config.md is out of date: run 'swift run MalumDocs' and commit it."
            exit 1
          fi
