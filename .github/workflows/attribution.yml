name: attribution

# Fails when a commit, the pull request text, the branch name, a file path or a changed line
# names an AI tool, or when a commit is authored by anyone else. Runs on every change, docs
# included, because it takes seconds. This file is the only path it skips, since it has to
# spell out the words it looks for. The pull request text is read from the API, not the event,
# and checked again for up to two minutes, so a footer removed right after opening does not fail.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: attribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WORDS: "claude|anthropic"
      GENERATED: "generated with"
      AUTHOR: "Joris van Dijk <joris@jorisvandijk.com>"
      SELF: ".github/workflows/attribution.yml"
      EVENT: ${{ github.event_name }}
      GH_TOKEN: ${{ github.token }}
      PR_API: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
      PR_TRIES: 9
      PR_WAIT: 15
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PUSH_BRANCH: ${{ github.ref_name }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_AFTER: ${{ github.event.after }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check
        run: |
          problems=0
          fail() {
            echo "::error::$1"
            problems=$((problems + 1))
          }
          has_word() { grep -qiE "$WORDS"; }
          has_generated() { grep -qiF "$GENERATED"; }

          if [ "$EVENT" = "pull_request" ]; then
            branch="$PR_BRANCH"
            head="$PR_HEAD"
            base="$(git merge-base "$PR_BASE" "$PR_HEAD")"
            commits="$(git rev-list "$PR_BASE..$PR_HEAD")"
            try=1
            while :; do
              pr="$(gh api "$PR_API")"
              title="$(printf '%s' "$pr" | jq -r '.title')"
              body="$(printf '%s' "$pr" | jq -r '.body // ""')"
              text_problem=""
              printf '%s\n%s\n' "$title" "$body" | has_word && text_problem="the pull request title or description names an AI tool"
              printf '%s\n' "$body" | has_generated && text_problem="the pull request description says \"Generated with\""
              [ -n "$text_problem" ] && [ "$try" -lt "$PR_TRIES" ] || break
              echo "[info] pull request text not clean yet, checking again in ${PR_WAIT}s ($try/$PR_TRIES)"
              try=$((try + 1))
              sleep "$PR_WAIT"
            done
            [ -z "$text_problem" ] || fail "$text_problem"
          else
            branch="$PUSH_BRANCH"
            head="$PUSH_AFTER"
            if ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              # A new branch, or a force push whose old head is gone: check every commit no
              # other branch has, and diff against the empty tree when the branch shares
              # nothing with the others.
              others="$(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -vx "refs/remotes/origin/$branch" || true)"
              commits="$(git rev-list "$head" --not $others)"
              base="$(git merge-base "$head" $others 2>/dev/null | head -n 1 || true)"
              [ -n "$base" ] || base="$(git hash-object -t tree /dev/null)"
            else
              base="$PUSH_BEFORE"
              commits="$(git rev-list "$PUSH_BEFORE..$PUSH_AFTER")"
            fi
          fi

          printf '%s\n' "$branch" | has_word && fail "the branch name names an AI tool: $branch"

          for commit in $commits; do
            short="$(git rev-parse --short "$commit")"
            git log -1 --format=%B "$commit" | has_word && fail "commit $short: the message names an AI tool"
            git log -1 --format=%B "$commit" | has_generated && fail "commit $short: the message says \"Generated with\""
            git log -1 --format='%an %ae %cn %ce' "$commit" | has_word && fail "commit $short: the author or committer names an AI tool"
            author="$(git log -1 --format='%an <%ae>' "$commit")"
            [ "$author" = "$AUTHOR" ] || fail "commit $short: authored by $author, not $AUTHOR"
          done

          paths="$(git diff --name-only --diff-filter=ACMR "$base" "$head" | grep -vxF "$SELF" || true)"
          printf '%s\n' "$paths" | has_word && fail "a file path names an AI tool: $(printf '%s\n' "$paths" | grep -iE "$WORDS" | head -n 5 | tr '\n' ' ')"

          lines="$(git diff --unified=0 "$base" "$head" -- . ":(exclude)$SELF" | grep -E '^\+' | grep -vE '^\+\+\+ ' || true)"
          printf '%s\n' "$lines" | has_word && fail "a changed line names an AI tool"

          if [ "$problems" -gt 0 ]; then
            echo "[error] $problems attribution problem(s) found"
            exit 1
          fi
          echo "[info] no attribution problems"
